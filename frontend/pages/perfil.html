<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Edita la información de tu perfil de Tinder UD.">
    <title>Editar perfil | Tinder UD</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="Tinder UD, inicio">
          <span class="brand-mark" aria-hidden="true">TU</span>
          <span>Tinder UD</span>
        </a>
        <a class="button button-secondary" href="../index.html">Volver a explorar</a>
      </header>

      <section class="panel profile-editor" aria-labelledby="profile-title">
        <p class="eyebrow">Tu presentación</p>
        <h1 id="profile-title">Editar perfil</h1>
        <p id="profile-name" class="muted"></p>
        <p id="profile-message" class="message" role="status" aria-live="polite"></p>
        <form id="profile-form" class="form-stack">
          <label for="profile-biography">Biografía</label>
          <textarea id="profile-biography" name="biography" rows="4" required></textarea>
          <label for="profile-faculty">Facultad</label>
          <input id="profile-faculty" name="faculty" type="text" required>
          <label for="profile-campus">Sede</label>
          <input id="profile-campus" name="campus" type="text" required>
          <label for="profile-interests">Intereses</label>
          <input id="profile-interests" name="interests" type="text" aria-describedby="interests-help">
          <p id="interests-help" class="field-help">Separa cada interés con una coma.</p>
          <div class="toolbar-actions">
            <button class="button button-primary" type="submit">Guardar perfil</button>
            <button id="profile-logout-button" class="button button-quiet" type="button">Salir</button>
          </div>
        </form>
      </section>

      <footer class="site-footer">
        <p>Las fotografías no están habilitadas en esta etapa del MVP.</p>
      </footer>
    </main>
  </body>
</html>
